# Family coverage gating — materialized into each repo at onboarding.
# 100% is brittle (it fails a PR over a single defensive branch or unreachable
# guard). These are floors with headroom, not a ratchet.
#   project — overall coverage floor for the package.
#   patch   — coverage required of the lines changed in a PR (new code).
# The 1% threshold absorbs rounding and small, justified dips.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 1%
