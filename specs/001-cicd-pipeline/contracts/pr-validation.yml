# Workflow Contract: PR Validation

**Workflow File**: `.github/workflows/pr-validation.yml`
**Trigger**: `pull_request` (opened, synchronize, reopened)
**Purpose**: Fast quality gates for pull requests to provide immediate feedback

## Trigger Configuration

```yaml
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
```

## Jobs

### Job: `validate-code`

**Runs on**: `ubuntu-latest`
**Timeout**: 10 minutes
**Concurrency**: Cancel in-progress runs for same PR

#### Steps

1. **Checkout Code**
   - Action: `actions/checkout@v4`
   - Depth: Full history for accurate coverage comparison

2. **Setup Python**
   - Action: `actions/setup-python@v5`
   - Version: `3.13`

3. **Install Poetry**
   - Action: `snok/install-poetry@v1`
   - Config: `virtualenvs-in-project: true`

4. **Cache Dependencies**
   - Action: `actions/cache@v4`
   - Key: `venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}`
   - Path: `.venv`

5. **Install Dependencies**
   - Command: `poetry install --with dev,docs`
   - Condition: Cache miss only

6. **Run Ruff Linting**
   - Command: `poetry run ruff check .`
   - Fail on: Any linting errors

7. **Run Ruff Formatting Check**
   - Command: `poetry run ruff format --check .`
   - Fail on: Formatting violations

8. **Run Type Checking**
   - Command: `poetry run mypy project`
   - Fail on: Type errors

9. **Run Fast Unit Tests**
   - Command: `poetry run pytest -m "not integration and not contract and not slow and not external" --nomigrations --reuse-db --cov=project --cov-report=xml --cov-report=term`
   - Database: SQLite (no PostgreSQL service needed)
   - Fail on: Test failures or coverage <80%

10. **Upload Coverage Report**
    - Action: `codecov/codecov-action@v4`
    - File: `coverage.xml`
    - Token: `${{ secrets.CODECOV_TOKEN }}`
    - Flags: `pr-tests`

### Job: `validate-docs`

**Runs on**: `ubuntu-latest`
**Timeout**: 5 minutes
**Condition**: Documentation files modified

#### Steps

1. **Checkout Code**
   - Action: `actions/checkout@v4`

2. **Setup Python**
   - Action: `actions/setup-python@v5`
   - Version: `3.13`

3. **Install Poetry**
   - Action: `snok/install-poetry@v1`

4. **Cache Dependencies**
   - Action: `actions/cache@v4`
   - Key: `venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}`

5. **Install Dependencies**
   - Command: `poetry install --with docs`

6. **Build Documentation**
   - Command: `poetry run sphinx-build -b html -W docs docs/_build/html`
   - Fail on: Build warnings or errors

7. **Check Links**
   - Command: `poetry run sphinx-build -b linkcheck docs docs/_build/linkcheck`
   - Fail on: Broken internal links

## Success Criteria

All jobs must pass for PR to be mergeable:
- ✅ Code linting passes
- ✅ Code formatting correct
- ✅ Type checking passes
- ✅ Fast unit tests pass
- ✅ Coverage ≥80%
- ✅ Documentation builds without warnings (if docs modified)
- ✅ No broken links in documentation (if docs modified)

## Expected Duration

- **Cold cache**: ~3-4 minutes
- **Warm cache**: ~2-3 minutes
- **Target**: <5 minutes

## Status Checks

Creates the following required status checks:
- `validate-code`
- `validate-docs` (if docs modified)

## Notifications

None (PR interface shows status checks)

## Secrets Required

- `CODECOV_TOKEN`: For coverage upload

## Environment Variables

- `DJANGO_SETTINGS_MODULE`: `config.settings`
- `DJANGO_ENV`: `development`
- `PYTHONPATH`: `project`

## Failure Examples

### Linting Failure
```
Ruff found 3 errors:
  src/models.py:42:1: F401 'unused import'
  src/views.py:15:80: E501 line too long (88 > 120)
```
**Action**: Run `poetry run ruff check . --fix` locally

### Test Failure
```
FAILED tests/test_import.py::test_template_validation - AssertionError: expected 'success' got 'error'
```
**Action**: Review test, fix code or test logic

### Coverage Failure
```
FAILED: Coverage is 78% (required: 80%)
Missing coverage in:
  project/ghfdb/importer.py: lines 45-52
```
**Action**: Add tests for uncovered lines
