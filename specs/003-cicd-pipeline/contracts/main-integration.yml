# Workflow Contract: Main Integration & Deployment

**Workflow File**: `.github/workflows/main-integration.yml`
**Trigger**: `push` to `main` branch
**Purpose**: Comprehensive validation, Docker build, and staging deployment

## Trigger Configuration

```yaml
on:
  push:
    branches:
      - main
```

## Jobs

### Job: `test-full-suite`

**Runs on**: `ubuntu-latest`
**Timeout**: 20 minutes
**Services**: PostgreSQL 15

#### Service: PostgreSQL

```yaml
services:
  postgres:
    image: postgres:15
    env:
      POSTGRES_DB: test_ghfdb
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
```

#### Steps

1. **Checkout Code**
   - Action: `actions/checkout@v4`

2. **Setup Python**
   - Action: `actions/setup-python@v5`
   - Version: `3.13`

3. **Install Poetry**
   - Action: `snok/install-poetry@v1`

4. **Cache Dependencies**
   - Action: `actions/cache@v4`

5. **Install Dependencies**
   - Command: `poetry install --with dev`

6. **Run Database Migrations**
   - Command: `poetry run python manage.py migrate --noinput`
   - Database: PostgreSQL service

7. **Run Full Test Suite**
   - Command: `poetry run pytest --reuse-db --cov=project --cov-report=xml --cov-report=term`
   - Includes: All test markers (integration, contract, slow)
   - Database: PostgreSQL with migrations applied

8. **Upload Coverage**
   - Action: `codecov/codecov-action@v4`
   - Flags: `main-tests`

### Job: `build-docker-image`

**Runs on**: `ubuntu-latest`
**Timeout**: 15 minutes
**Depends on**: `test-full-suite` (must pass)

#### Steps

1. **Checkout Code**
   - Action: `actions/checkout@v4`

2. **Set up Docker Buildx**
   - Action: `docker/setup-buildx-action@v3`

3. **Login to GHCR**
   - Action: `docker/login-action@v3`
   - Registry: `ghcr.io`
   - Username: `${{ github.actor }}`
   - Password: `${{ secrets.GITHUB_TOKEN }}`

4. **Extract Metadata**
   - Action: `docker/metadata-action@v5`
   - Tags: `${{ github.sha }}`, `latest`

5. **Build and Push**
   - Action: `docker/build-push-action@v5`
   - Push: `true`
   - Tags: `ghcr.io/ihfc-iugg/global-heat-flow-database:${{ github.sha }}` and `:latest`
   - Cache: GitHub Actions cache

6. **Create Deployment Record**
   - Action: `actions/github-script@v7`
   - Creates GitHub deployment for staging

### Job: `deploy-staging`

**Runs on**: `ubuntu-latest`
**Timeout**: 10 minutes
**Depends on**: `build-docker-image` (must pass)
**Environment**: `staging`

#### Steps

1. **Checkout Code**
   - Action: `actions/checkout@v4`

2. **Setup SSH**
   - Action: `webfactory/ssh-agent@v0.9.0`
   - Key: `${{ secrets.STAGING_DEPLOY_KEY }}`

3. **Deploy to Staging**
   - Command:
     ```bash
     ssh staging-server << 'EOF'
       cd /app/ghfdb
       docker-compose pull
       docker-compose up -d
       docker-compose ps
     EOF
     ```

4. **Run Smoke Tests**
   - Script: `.github/scripts/smoke-test.sh`
   - Target: `https://staging.heatflow.world`
   - Retry: 3 attempts with 30s delay

5. **Update Deployment Status**
   - Action: `actions/github-script@v7`
   - Status: `success` or `failure`

6. **Rollback on Failure**
   - Condition: `failure()`
   - Command:
     ```bash
     ssh staging-server << 'EOF'
       cd /app/ghfdb
       git log -1 --skip=1 --format=%H > .last-deploy
       docker-compose pull
       docker-compose up -d
     EOF
     ```

### Job: `notify-team`

**Runs on**: `ubuntu-latest`
**Timeout**: 2 minutes
**Depends on**: `deploy-staging` (always runs)
**Condition**: Always (success or failure)

#### Steps

1. **Send Slack Notification**
   - Action: `8398a7/action-slack@v3`
   - Webhook: `${{ secrets.SLACK_WEBHOOK }}`
   - Message:
     ```
     Staging Deployment: ${{ job.status }}
     Commit: ${{ github.sha }} by ${{ github.actor }}
     Link: https://staging.heatflow.world
     Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
     ```

## Success Criteria

Pipeline succeeds when:
- ✅ All tests pass with real PostgreSQL database
- ✅ Coverage ≥80%
- ✅ Docker image builds successfully
- ✅ Staging deployment completes
- ✅ Smoke tests pass on staging

## Expected Duration

- **test-full-suite**: ~8-12 minutes
- **build-docker-image**: ~5-7 minutes
- **deploy-staging**: ~3-5 minutes
- **Total**: ~15-20 minutes

## Failure Handling

### Test Failure
- Pipeline halts, no build/deploy
- Team notified of failure
- Developer must fix and push again

### Build Failure
- Pipeline halts, no deploy
- Previous Docker image remains in GHCR
- Team notified

### Deployment Failure
- Automatic rollback to previous image
- Team notified urgently
- Staging environment restored to last known good state

## Secrets Required

- `GITHUB_TOKEN`: Auto-provided by GitHub Actions
- `CODECOV_TOKEN`: Coverage upload
- `STAGING_DEPLOY_KEY`: SSH key for staging server
- `SLACK_WEBHOOK`: Team notification

## Environment Variables

- `DATABASE_URL`: PostgreSQL connection string
- `DJANGO_SETTINGS_MODULE`: `config.settings`
- `DJANGO_ENV`: `production` (for staging deploy)

## Artifacts

- Docker image: `ghcr.io/ihfc-iugg/global-heat-flow-database:SHA`
- Coverage report: Uploaded to Codecov
- Test results: GitHub Actions UI
- Deployment record: GitHub Deployments API
