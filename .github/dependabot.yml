# Dependabot configuration.
#
# Each ecosystem groups every update under a single "*" pattern, so one update
# cycle produces one pull request rather than one per package. Ungrouped
# configuration is what let ten pull requests accumulate here unmerged.
#
# The previous configuration pointed at eight Dockerfiles under `compose/` and a
# `requirements.txt`, none of which exist in this repository. Every Dependabot
# run failed as a result.
version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # mvp-shared is a git dependency pinned to a tag, and the same tag is
    # pinned again in every workflow that calls django-mvp/shared. The two have
    # to move together, which a Dependabot bump to pyproject.toml and uv.lock
    # alone cannot do, so the tag is bumped by hand when a shared release lands.
    ignore:
      - dependency-name: "mvp-shared"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # No docker entry. The root Dockerfile builds on the FairDM base image whose
  # version the pinned FairDM declares, passed in as a build argument, so the
  # image moves when the FairDM pin does and there is nothing here to bump.
