# Dependabot configuration.
#
# Each ecosystem groups every update under a single "*" pattern, so one update
# cycle produces one pull request rather than one per package. Ungrouped
# configuration is what let ten pull requests accumulate here unmerged.
#
# The previous configuration pointed at eight Dockerfiles under `compose/` and a
# `requirements.txt`, none of which exist in this repository. Every Dependabot
# run failed as a result.
version: 2
updates:
  # Python dependencies (Poetry)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Container image (deploy/Dockerfile; Dependabot does not read Compose files)
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Python version in the image is a deliberate choice, tied to the
    # version the test matrix runs and the version the dependencies support.
    # Moving it is a migration, not a dependency bump, so it is made by hand.
    ignore:
      - dependency-name: "python"
    groups:
      docker:
        patterns:
          - "*"
