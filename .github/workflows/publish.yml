name: Publish

# Step 3 of the release flow. Where a library would publish to PyPI, this
# project publishes a container image to GHCR — that image is the deliverable.
#
# The build is gated behind the release flow rather than running on every push
# to main: an image is produced for a version that Prepare Release prepared and
# Tag Release tagged, so every image in the registry corresponds to a release.
# `deployment/docker-compose.yml` pulls ghcr.io/ihfc-iugg/ghfdb-portal:latest.
#
# The build is inlined rather than calling a shared workflow. The family has no
# container workflow to converge on, and the only existing one lives in a
# different account pinned to a moving branch.
#
# On pull requests the image is built but not pushed, so a broken Dockerfile is
# caught at review time rather than at release time.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  pull_request:
    paths:
      - 'deployment/Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: the build runs, the push does not, so no
      # registry credentials are needed to validate a Dockerfile change.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Never pushed; present only so build-push-action has a tag.
            echo "tags=${IMAGE}:pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # v2026.8.1 -> 2026.8.1. Both the version tag and `latest` are
          # published, because the Compose file tracks `latest` while a
          # rollback needs an exact version to pin to.
          REF="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${REF#v}"

          # Multi-line outputs need a delimiter; a bare newline is truncated.
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
