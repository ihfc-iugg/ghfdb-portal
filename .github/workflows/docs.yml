name: Deploy Docs

# Publishes the Sphinx documentation to GitHub Pages, replacing the Read the
# Docs build.
#
# Currently dispatch-only. Add the push trigger below once a dispatched run has
# published a site that looks right.
#
#   push:
#     branches: [main]
#     paths: ['docs/**', 'project/**', 'pyproject.toml', '.github/workflows/docs.yml']
on:
  workflow_dispatch:

# The called workflow's deploy job needs these. A caller that grants less fails
# at startup, even on runs where the deploy is skipped.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call-docs:
    uses: django-mvp/shared/.github/workflows/docs.yml@v0.6.0
    with:
      uv-sync-args: '--group docs'
    secrets: inherit
