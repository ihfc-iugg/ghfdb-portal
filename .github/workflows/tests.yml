name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  call-tests:
    uses: FAIR-DM/shared/.github/workflows/tests.yml@v0.1.0
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  call-browser-tests:
    uses: FAIR-DM/shared/.github/workflows/browser-tests.yml@v0.1.0
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
