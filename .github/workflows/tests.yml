name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'project/**'
      - 'config/**'
      - 'tests/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
      - '.github/workflows/test-suite.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: ./.github/workflows/test-suite.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
