name: Build checks

# The shared build workflow (django-mvp/shared v0.6.0) with GDAL, GEOS and PROJ installed for
# Code Quality, so a hook that sets Django up can load GeoDjango. Modelled on FairDM's, whose
# mypy plugin needs them. It is called from build.yml as a reusable workflow so the checks keep
# their required names,
# "call-build / Code Quality", "call-build / Security Scan" and "call-build / Build Package".

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job syncs the environment once, explicitly and with --locked. After
  # that, `uv run` uses the environment as it stands instead of re-syncing it,
  # so a tool installed into it for one job (pip-audit) stays put.
  UV_NO_SYNC: "1"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-suffix: code-quality

      - name: Install GDAL, GEOS and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdal-bin

      # --locked fails the job when uv.lock is out of date with pyproject.toml,
      # which is the lockfile consistency check.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Load cached pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-suffix: security

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run bandit security linter
        # This is a report, not a gate (ADR 0007): findings never fail the
        # build at v0.x, but a scanner that produces no report must — a broken
        # scanner silently looking like a clean scan is exactly how this job
        # went unnoticed (django-mvp/shared#23). The `|| true` swallows only
        # bandit's own "issues found" exit code; the emitted artefact is
        # asserted on next, never a piped exit code.
        #
        # bandit reads source files and needs nothing from the project
        # environment, so it runs in a throwaway one rather than being added to
        # the environment pip-audit is about to inspect.
        run: uvx --from "bandit[toml]" bandit -r project/ -f json -o bandit-report.json || true

      - name: Verify bandit report was produced
        run: |
          test -s bandit-report.json
          python3 -c "import json; json.load(open('bandit-report.json'))"

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run pip-audit for known vulnerabilities
        # pip-audit replaces safety (django-mvp/shared#23): safety 3.x needs an
        # authenticated account against its vulnerability database, which is
        # the wrong shape for unattended CI. pip-audit needs none. It is
        # installed into, and run from, the project environment this job
        # synced, so it audits the packages actually installed rather than the
        # runner's bare system interpreter; --local excludes anything outside
        # that environment from the report.
        run: |
          uv pip install pip-audit
          uv run pip-audit --local --format json --output pip-audit-report.json --progress-spinner off || true

      - name: Verify pip-audit report was produced
        run: |
          test -s pip-audit-report.json
          python3 -c "import json; json.load(open('pip-audit-report.json'))"

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-suffix: package

      - name: Build package
        run: uv build

      # twine reads the built wheel and sdist metadata the way PyPI's upload
      # endpoint does, including whether the rendered long description parses:
      # a check on what actually ships rather than on the source that produced
      # it. `uvx` runs it without adding twine to any bundle.
      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
