name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (must be "production")'
        required: true
        type: choice
        options:
          - production
      commit_sha:
        description: 'Commit SHA or tag to deploy'
        required: true
        type: string
      approval_confirmation:
        description: 'Type APPROVED to confirm deployment'
        required: true
        type: string

jobs:
  validate-deployment:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      approved: ${{ steps.validate.outputs.approved }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate approval confirmation
        id: validate
        run: |
          if [ "${{ inputs.approval_confirmation }}" != "APPROVED" ]; then
            echo "❌ Deployment not approved. Must type APPROVED exactly."
            exit 1
          fi

          if [ "${{ inputs.environment }}" != "production" ]; then
            echo "❌ Invalid environment. Must be 'production'."
            exit 1
          fi

          echo "✅ Deployment approved"
          echo "approved=true" >> $GITHUB_OUTPUT

      - name: Verify commit exists
        run: |
          git fetch --all --tags
          if ! git rev-parse "${{ inputs.commit_sha }}" >/dev/null 2>&1; then
            echo "❌ Commit SHA or tag '${{ inputs.commit_sha }}' not found"
            exit 1
          fi
          echo "✅ Commit verified"

      - name: Check if tests passed for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.commit_sha }}';

            // Query for main-integration workflow runs for this SHA
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'main-integration.yml',
              head_sha: sha,
              status: 'completed'
            });

            if (runs.data.total_count === 0) {
              core.setFailed(`No main-integration workflow runs found for commit ${sha}`);
              return;
            }

            const latestRun = runs.data.workflow_runs[0];
            if (latestRun.conclusion !== 'success') {
              core.setFailed(`Tests failed for commit ${sha}. Latest run: ${latestRun.conclusion}`);
              return;
            }

            console.log(`✅ Tests passed for commit ${sha}`);

      - name: Extract version tag
        id: extract-version
        run: |
          # Try to get version from tag
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "sha-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Generate pre-deployment report
        run: |
          echo "# Pre-Deployment Report" > deployment-report.md
          echo "" >> deployment-report.md
          echo "**Environment**: ${{ inputs.environment }}" >> deployment-report.md
          echo "**Version**: ${{ steps.extract-version.outputs.version }}" >> deployment-report.md
          echo "**Commit**: ${{ inputs.commit_sha }}" >> deployment-report.md
          echo "**Deployer**: ${{ github.actor }}" >> deployment-report.md
          echo "**Date**: $(date -u +%Y-%m-%d\ %H:%M\ UTC)" >> deployment-report.md
          echo "" >> deployment-report.md
          echo "## Recent Commits" >> deployment-report.md
          git log --oneline -10 >> deployment-report.md
          cat deployment-report.md

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment-report.md

  build-release-image:
    name: Build Release Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-deployment
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate-deployment.outputs.version }}
            type=raw,value=production
            type=sha,prefix=prod-

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-deployment, build-release-image]
    environment:
      name: production
      url: https://heatflow.world
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Record deployment start
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ inputs.commit_sha }}',
              environment: 'production',
              description: 'Production deployment v${{ needs.validate-deployment.outputs.version }}',
              required_contexts: [],
              auto_merge: false
            });

            core.setOutput('deployment_id', deployment.data.id);

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deployment in progress'
            });

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Create production backup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /opt/ghfdb-portal
            # Tag current image as backup
            docker tag ghcr.io/${{ github.repository }}:production ghcr.io/${{ github.repository }}:production-backup-$(date +%Y%m%d-%H%M%S)
            echo "✅ Backup created"
          EOF

      - name: Deploy to production server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /opt/ghfdb-portal
            docker-compose -f production.yml pull
            docker-compose -f production.yml up -d
            docker-compose -f production.yml exec -T django python manage.py migrate --noinput
            docker-compose -f production.yml exec -T django python manage.py collectstatic --noinput
            echo "✅ Deployment complete"
          EOF

      - name: Wait for containers to be healthy
        run: |
          echo "Waiting for containers to start..."
          sleep 30

      - name: Run smoke tests
        run: |
          chmod +x .github/scripts/smoke-test.sh
          for i in {1..3}; do
            if .github/scripts/smoke-test.sh https://heatflow.world; then
              exit 0
            fi
            echo "Smoke test attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "❌ Smoke tests failed after 3 attempts"
          exit 1

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'success',
              environment_url: 'https://heatflow.world',
              description: 'Production deployment successful'
            });

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /opt/ghfdb-portal
            # Find most recent backup
            BACKUP=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep production-backup | head -1)
            if [ -n "$BACKUP" ]; then
              docker tag "$BACKUP" ghcr.io/${{ github.repository }}:production
              docker-compose -f production.yml up -d
              echo "✅ Rolled back to: $BACKUP"
            else
              echo "❌ No backup found for rollback"
            fi
          EOF

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'failure',
              description: 'Production deployment failed, rolled back'
            });

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-deployment, deploy-production]
    if: success() && startsWith(github.event.inputs.commit_sha, 'v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${{ inputs.commit_sha }}"
            git log $PREV_TAG..${{ inputs.commit_sha }} --oneline --no-merges > CHANGELOG.txt
          else
            echo "No previous tag found, listing all commits"
            git log ${{ inputs.commit_sha }} --oneline --no-merges | head -20 > CHANGELOG.txt
          fi

          cat CHANGELOG.txt

      - name: Download deployment report
        uses: actions/download-artifact@v8
        with:
          name: deployment-report

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.commit_sha }}
          release_name: Release ${{ needs.validate-deployment.outputs.version }}
          body_path: deployment-report.md
          draft: false
          prerelease: false

  notify-deployment:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-deployment, deploy-production]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Slack notification
        run: |
          chmod +x .github/scripts/notify.sh
          STATUS="${{ needs.deploy-production.result == 'success' && 'success' || 'failure' }}"
          .github/scripts/notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "$STATUS" \
            "Production deployment ${{ needs.deploy-production.result }}" \
            "Version: ${{ needs.validate-deployment.outputs.version }}\nCommit: ${{ inputs.commit_sha }}\nDeployer: ${{ github.actor }}\nURL: https://heatflow.world\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
