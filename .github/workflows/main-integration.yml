name: Main Branch Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**.md'

jobs:
  test-full-suite:
    name: Full Test Suite with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ghfdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev,docs --no-interaction

      - name: Run Django migrations
        run: |
          poetry run python manage.py migrate --noinput
        env:
          DJANGO_ENV: development
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghfdb_test

      - name: Run full test suite (all markers)
        run: |
          poetry run pytest \
            --reuse-db \
            --cov=project \
            --cov-report=xml \
            --cov-report=term-missing \
            --verbose
        env:
          DJANGO_ENV: development
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghfdb_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: main-tests
          name: main-full-suite
          fail_ci_if_error: true

  build-docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-full-suite
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Create GitHub deployment record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              description: 'Automated staging deployment from main branch',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false
            });

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-docker-image
    environment:
      name: staging
      url: https://staging.heatflow.world
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Deploy to staging server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/ghfdb-portal
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d
            docker-compose -f docker-compose.yml exec -T django python manage.py migrate --noinput
            docker-compose -f docker-compose.yml exec -T django python manage.py collectstatic --noinput
          EOF

      - name: Run smoke tests
        run: |
          chmod +x .github/scripts/smoke-test.sh
          for i in {1..3}; do
            if .github/scripts/smoke-test.sh https://staging.heatflow.world; then
              exit 0
            fi
            echo "Smoke test attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Smoke tests failed after 3 attempts"
          exit 1

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              environment: 'staging'
            });

            if (deployments.data.length > 0) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployments.data[0].id,
                state: 'success',
                environment_url: 'https://staging.heatflow.world',
                description: 'Staging deployment successful'
              });
            }

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/ghfdb-portal
            docker-compose -f docker-compose.yml down
            docker-compose -f docker-compose.yml up -d
          EOF
          echo "⚠️ Deployment failed, rolled back to previous version"

  notify-team:
    name: Notify Team
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-full-suite, build-docker-image, deploy-staging]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            *Main Branch Integration*
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Committer: ${{ github.actor }}
            Environment: Staging
            URL: https://staging.heatflow.world

            Tests: ${{ needs.test-full-suite.result }}
            Build: ${{ needs.build-docker-image.result }}
            Deploy: ${{ needs.deploy-staging.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          channel: '#deployments'
          username: 'GitHub Actions'
          icon_emoji: ':rocket:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send notification on failure
        if: failure()
        run: |
          chmod +x .github/scripts/notify.sh
          .github/scripts/notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "failure" \
            "Main branch integration failed" \
            "Commit: ${{ github.sha }} by ${{ github.actor }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
