title: "[CI/CD Feedback] Quarterly Experience Survey"
labels: ["ci-cd", "feedback", "developer-experience"]
body:
  - type: markdown
    attributes:
      value: |
        ## CI/CD Pipeline Experience Survey

        Help us improve the CI/CD pipeline by sharing your experience. This survey supports **Success Criterion SC-002**: 80% of contributors report CI/CD pipeline is helpful (measured quarterly).

        **Time Required**: 3-5 minutes
        **Confidential**: Responses are aggregated and anonymized

  - type: dropdown
    id: experience-level
    attributes:
      label: Experience Level
      description: How familiar are you with this project's CI/CD pipeline?
      options:
        - First-time contributor
        - Occasional contributor (1-5 PRs)
        - Regular contributor (6-20 PRs)
        - Frequent contributor (20+ PRs)
        - Project maintainer
    validations:
      required: true

  - type: dropdown
    id: overall-helpfulness
    attributes:
      label: Overall CI/CD Helpfulness
      description: "Do you find the CI/CD pipeline helpful in your contribution workflow?"
      options:
        - "5 - Very Helpful"
        - "4 - Helpful"
        - "3 - Neutral"
        - "2 - Somewhat Unhelpful"
        - "1 - Very Unhelpful"
    validations:
      required: true

  - type: checkboxes
    id: helpful-aspects
    attributes:
      label: What aspects of the CI/CD pipeline are most helpful?
      description: Select all that apply
      options:
        - label: Fast feedback on PRs (linting, tests, coverage)
        - label: Clear error messages when checks fail
        - label: Automatic staging deployments
        - label: Documentation builds and validation
        - label: Security scanning (secrets, dependencies)
        - label: Coverage reports and trends
        - label: Workflow status badges
        - label: CI/CD documentation (guides, troubleshooting)

  - type: checkboxes
    id: pain-points
    attributes:
      label: What aspects need improvement?
      description: Select all that apply
      options:
        - label: PR checks take too long
        - label: Confusing error messages
        - label: Difficult to reproduce CI failures locally
        - label: Too many false positives (flaky tests)
        - label: Deployment process is unclear
        - label: Insufficient documentation
        - label: Hard to find CI/CD help when stuck
        - label: Too many notifications

  - type: dropdown
    id: feedback-speed
    attributes:
      label: PR Feedback Speed
      description: "How satisfied are you with the speed of PR validation checks?"
      options:
        - "5 - Very Satisfied (< 3 minutes typical)"
        - "4 - Satisfied (3-5 minutes typical)"
        - "3 - Acceptable (5-10 minutes typical)"
        - "2 - Slow (10-15 minutes typical)"
        - "1 - Very Slow (> 15 minutes typical)"
    validations:
      required: true

  - type: dropdown
    id: error-clarity
    attributes:
      label: Error Message Clarity
      description: When CI checks fail, how easy is it to understand what went wrong?
      options:
        - "5 - Very Clear"
        - "4 - Clear"
        - "3 - Somewhat Clear"
        - "2 - Confusing"
        - "1 - Very Confusing"
    validations:
      required: true

  - type: dropdown
    id: documentation-quality
    attributes:
      label: CI/CD Documentation Quality
      description: How would you rate the CI/CD documentation (CONTRIBUTING.md, ci-cd-guide.md, quickstart.md)?
      options:
        - "5 - Excellent"
        - "4 - Good"
        - "3 - Adequate"
        - "2 - Needs Improvement"
        - "1 - Poor"
        - "N/A - Haven't read it"
    validations:
      required: true

  - type: textarea
    id: local-testing
    attributes:
      label: Local Testing Experience
      description: Can you easily reproduce CI checks locally before pushing?
      placeholder: |
        Example: "Yes, the commands in CONTRIBUTING.md work perfectly" or "No, I struggle with environment setup"
    validations:
      required: false

  - type: textarea
    id: time-saved
    attributes:
      label: Time Saved (or Lost)
      description: Estimate how much time the CI/CD pipeline saves you per week, or if it costs time, how much?
      placeholder: |
        Example: "Saves ~2 hours/week by catching errors early" or "Costs ~30 minutes/week due to false positives"
    validations:
      required: false

  - type: textarea
    id: specific-issues
    attributes:
      label: Specific Issues or Incidents
      description: Describe any specific incidents where CI/CD blocked you or was particularly frustrating
      placeholder: |
        Example: "On Jan 15, PR checks took 45 minutes due to runner availability"
    validations:
      required: false

  - type: textarea
    id: improvement-suggestions
    attributes:
      label: Improvement Suggestions
      description: What specific improvements would make the CI/CD pipeline more helpful?
      placeholder: |
        Example: "Add a pre-commit hook to run ruff locally" or "Split slow tests into a separate workflow"
    validations:
      required: false

  - type: dropdown
    id: would-recommend
    attributes:
      label: Would Recommend This CI/CD Setup
      description: Would you recommend this CI/CD setup to other projects?
      options:
        - "Yes, definitely"
        - "Yes, with minor improvements"
        - "Neutral"
        - "No, needs major improvements"
        - "No, not at all"
    validations:
      required: true

  - type: textarea
    id: additional-comments
    attributes:
      label: Additional Comments
      description: Any other feedback about the CI/CD pipeline?
      placeholder: Tell us anything else we should know
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        **Thank you for your feedback!**

        This survey helps us track **SC-002** (80% helpfulness) and improve the developer experience. Results are reviewed quarterly by maintainers.
