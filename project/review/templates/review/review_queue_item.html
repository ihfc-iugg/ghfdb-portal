{% load i18n %}
<c-card title="{{ review.literature }}">
  <p>{% trans "Uploaded by" %}: {{ review.uploaded_by|default:_("Unknown") }}</p>
  <form method="post"
        action="{% url "review-decide" pk=review.pk %}">
    {% csrf_token %}
    <input type="hidden" name="action" value="approve" />
    <c-button type="submit"
              text="{% trans "Approve" %}"
              variant="primary" />
  </form>
  <form method="post"
        action="{% url "review-decide" pk=review.pk %}">
    {% csrf_token %}
    <input type="hidden" name="action" value="send_back" />
    <textarea name="comment"
              placeholder="{% trans "What needs to change" %}"
              required></textarea>
    <c-button type="submit"
              text="{% trans "Send back" %}"
              variant="secondary" />
  </form>
</c-card>
