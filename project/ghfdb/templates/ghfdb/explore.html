{% extends "page_view.html" %}
{% block content %}
  <c-page fill>
    <c-page.content>
      <div class="w-full h-full">
        <iframe src="https://ihfc-iugg.github.io/HeatFlowMapping/"
                width="100%"
                height="100%"
                style="border:none"
                loading="lazy"
                onerror="this.style.display='none'; document.getElementById('map-error').style.display='block';"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen></iframe>
        <div id="map-error"
             class="explore-fallback"
             style="display:none;
                    margin:1rem;
                    padding:1rem;
                    border:1px solid #e5a1a1;
                    background:#fff4f4;
                    color:#7a1f1f">
          {% trans "The interactive map is temporarily unavailable. Please try again later." %}
        </div>
      </div>
    </c-page.content>
  </c-page>
{% endblock content %}
{% block app.footer %}
{% endblock app.footer %}
