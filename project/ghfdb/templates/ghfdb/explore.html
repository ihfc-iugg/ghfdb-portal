<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />
    <title>GHFDB Explore</title>
  </head>
  <body style="margin:0">
    <iframe src="https://ihfc-iugg.github.io/HeatFlowMapping/"
            width="100%"
            height="100vh"
            style="border:none"
            loading="lazy"
            onerror="this.style.display='none'; document.getElementById('map-error').style.display='block';"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen></iframe>
    <div id="map-error"
         class="explore-fallback"
         style="display:none;
                margin:1rem;
                padding:1rem;
                border:1px solid #e5a1a1;
                background:#fff4f4;
                color:#7a1f1f">The interactive map is temporarily unavailable. Please try again later.</div>
  </body>
</html>
