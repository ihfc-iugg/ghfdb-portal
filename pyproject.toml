[project]
name = "global-heat-flow-database"
description = "Code base for the IHFC's Global Heat Flow Database web application"
license = "MIT"
readme = "README.md"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
requires-python = ">=3.13,<4.0"
# Version stays in [tool.poetry] because that is what the release flow bumps.
# Dependencies stay there too: several are git references, which are clearer in
# Poetry's form than as PEP 508 direct references.
dynamic = ["version", "dependencies"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ihfc-iugg/ghfdb-portal"
"World Heat Flow Database Project" = "https://heatflow.world"
IHFC = "http://ihfc-iugg.org"

[tool.poetry]
# Source of truth for the release flow: tag-release cuts v<version> when no
# matching tag exists on a main push touching this file.
version = "2025.21"
requires-poetry = ">=2.0,<3.0"
include = ["LICENSE", "README.md"]
packages = [
    { include = "heat_flow", from = "project" },
    { include = "ghfdb", from = "project" },
    { include = "review", from = "project" },
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fairdm = { git = "https://github.com/FAIR-DM/fairdm" }
fairdm-geo = { git = "https://github.com/FAIR-DM/fairdm-geo" }
fairdm-discussions = { git = "https://github.com/FAIR-DM/fairdm-discussions" }

[tool.poetry.group.test.dependencies]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", rev = "v0.3.2", extras = [
    "test",
] }


[tool.poetry.group.dev.dependencies]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", rev = "v0.3.2", extras = [
    "dev",
] }
numpy = "^2.5.2"

[tool.poetry.group.docs.dependencies]
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs", extras = [
    "sphinx-book-theme",
] }

[build-system]
requires = ["poetry-core (>=2.0,<3.0)"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# line-length is deliberately unset: Ruff's default is 88, matching Black, which
# is what Django, pytest and httpx ship. PEP 8 caps a team's own preference at 99.
# target-version is deliberately unset too: Ruff infers it from requires-python,
# so it cannot drift above the versions this package actually supports.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*.py",
    "staticfiles/*",
    "docs/",
    ".github/",
]
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # ClassAttributesShouldBeAnnotated
    "RUF012",
    "TRY003",
    # Use of mark_safe
    "S308",
    # Use of standard pseudo-random generators
    "S311",
    "A003",
    "F403",
    "F405",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
# `tests/**`, not `**/tests/*`: the latter matches only files directly inside a
# `tests` directory, so every nested test module (tests/test_views/…) silently
# missed these ignores.
# S101/S105/S106: asserts and placeholder credentials are the point of a test.
# RUF002/RUF003: prose punctuation in test docstrings and comments is not a defect
# (the rules stay enabled for the package itself).
"tests/**" = ["S101", "S105", "S106", "RUF002", "RUF003"]
# Demo/dev settings carry an intentional non-secret placeholder SECRET_KEY.
"**/demo/settings.py" = ["S105"]
# fairdm.setup() injects its settings into this module's namespace at runtime,
# so names it defines (MVP_CONFIG, EASY_ICONS, INSTALLED_APPS, ALLOWED_HOSTS)
# have no visible binding here. Every F821 in this file is that pattern.
"config/settings.py" = ["F821"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"
exclude = ["*/migrations/*.py"]

[tool.djlint]
blank_line_after_tag = "c-vars"
close_void_tags = true
custom_html = "c-[\\w.-]+"
format_js = true
format_css = true
indent = 2
max_attribute_length = 50
max_blank_lines = 0
max_line_length = 119
ignore = "H016,H030,H031,H021,D018,H037"
format_attribute_template_tags = false

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.mypy]
files = ["project"]
strict = false
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["project"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["--tb=short", "--strict-markers", "--reuse-db", "--nomigrations"]
markers = [
    "heat_flow: Tests for the heat_flow app",
    "ghfdb: Tests for the ghfdb app",
    "review: Tests for the review app",
    "integration: Integration tests",
    "slow: Slow running tests",
]

filterwarnings = ["ignore", "default:::laboratory"]
env = ["DJANGO_ENV=development"]

[tool.coverage.report]
skip_empty = true
omit = ["*site-packages*", "*tests*", "*.tox*"]
show_missing = "true"


[tool.coverage.run]
branch = "true"
source = ["laboratory"]


[tool.deptry]
skip_misplaced_dev = "true"
extend_exclude = ["tasks.py", "docs", ".*tests", ".*migrations"]
ignore_transitive = ["toml", "sentry_sdk"]

ignore_missing = ["ghfdb"]

[tool.tox]
legacy_tox_ini = """
[tox]
skipsdist = true
envlist = py310, py311

[gh-actions]
python =
    3.10: py310
    3.11: py311

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = poetry
commands =
    poetry install -v --without docs
    pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    mypy
"""
